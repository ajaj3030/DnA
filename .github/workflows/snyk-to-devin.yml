# Event-driven remediation: when a push to main changes a package.json, Snyk
# scans the dependency tree before and after the push. Each NEW high or
# critical finding starts a Devin session that opens a fix PR on this repo.
# Existing backlog findings are left to Devin Security's bulk assignment.
name: Snyk → Devin remediation

on:
  push:
    branches: [main]
    paths: ["packages/**/package.json"]
  workflow_dispatch:
    inputs:
      manifest:
        description: package.json to scan
        default: packages/frontend/package.json
      base:
        description: Commit to compare against (default HEAD^)
        default: ""
      dry_run:
        description: Report findings without starting Devin sessions
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: snyk-to-devin
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install Snyk CLI
        run: npm install --global snyk@1.1308.4
      - name: Scan and hand new findings to Devin
        run: python3 .github/scripts/snyk_to_devin.py
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.base }}
          MANIFESTS: ${{ inputs.manifest }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
