# Snyk opens a fix PR (Snyk app: "Fix this vulnerability", or its automatic
# fix PRs) → Snyk and OSV-Scanner findings are ingested into Devin Security,
# which deduplicates them across both tools and validates them → Devin
# remediates the findings for the packages Snyk's PR touches, opening its
# fixes against Snyk's branch.
# Everything after the trigger is visible on the Devin Security screen.
name: Snyk fix PR → Devin Security

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the Snyk pull request
        required: true
      dry_run:
        description: Run Snyk and report, without sending anything to Devin
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: snyk-fix-pr-to-devin-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  devin-security:
    # Only pull requests Snyk opened (title "[Snyk] ...", branch snyk-...)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.title, '[Snyk]') ||
      startsWith(github.head_ref, 'snyk-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install Snyk CLI
        run: npm install --global snyk@1.1308.4
      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum --check
          sudo install osv-scanner /usr/local/bin/osv-scanner
      - name: Ingest Snyk and OSV-Scanner findings into Devin Security and remediate
        run: python3 .github/scripts/snyk_fix_pr_to_devin.py
        env:
          GH_TOKEN: ${{ github.token }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          DEVIN_V3_API_KEY: ${{ secrets.DEVIN_V3_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          DEVIN_INGEST_PROFILE_ID: ${{ vars.DEVIN_INGEST_PROFILE_ID }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
